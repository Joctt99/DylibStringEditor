name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen generate
      working-directory: DylibStringEditor

    - name: Build (iOS Release, no code signing)
      run: |
        xcodebuild \
          -project DylibStringEditor.xcodeproj \
          -scheme DylibStringEditor \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          EXPANDED_CODE_SIGN_IDENTITY="" \
          EXPANDED_CODE_SIGN_IDENTITY_NAME="" \
          ONLY_ACTIVE_ARCH=NO \
          build
      working-directory: DylibStringEditor

    - name: Locate .app
      run: |
        find ~/Library/Developer/Xcode/DerivedData -name "DylibStringEditor.app" -type d 2>/dev/null | head -1
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "DylibStringEditor.app" -type d 2>/dev/null | head -1)
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
        if [ -z "$APP_PATH" ]; then
          echo "::error::App not found"
          exit 1
        fi

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r -q DylibStringEditor.ipa Payload
        ls -la DylibStringEditor.ipa
      working-directory: DylibStringEditor

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: DylibStringEditor.ipa
        path: DylibStringEditor/DylibStringEditor.ipa
